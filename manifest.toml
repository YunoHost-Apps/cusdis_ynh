#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "cusdis"
name = "Cusdis"
description.en = "Lightweight, privacy-friendly alternative to Disqus"
description.fr = "Alternative légère et respectueuse de la vie privée à Disqus"

version = "1.3.2~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0"
website = "https://cusdis.com/"
admindoc = "https://cusdis.com/doc#/self-host/manual"
code = "https://github.com/djyde/cusdis"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = false

ldap = false

sso = false

disk = "2000M"
ram.build = "1200M"
ram.runtime = "250M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

    [install.password]
    type = "password"

[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/djyde/cusdis/archive/refs/tags/v1.3.2.tar.gz"
    sha256 = "f480f4dbbc0bb320a505a02248738d4c4ce44129af5227b2b5a9b05629bdb09e"

    autoupdate.strategy = "latest_github_tag"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 3000

    [resources.apt]
    packages = "postgresql, build-essential"

    extras.yarn.repo = "deb https://dl.yarnpkg.com/debian/ stable main"
    extras.yarn.key = "https://dl.yarnpkg.com/debian/pubkey.gpg"
    extras.yarn.packages = "yarn"

    [resources.database]
    type = "postgresql"
